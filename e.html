<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<meta name="google-adsense-account" content="ca-pub-2332110455488458">
<meta name="description" content="Free online background remover. Remove simple white, black or selected-color backgrounds from images and download transparent PNG files.">
<meta name="robots" content="index, follow">

<link rel="canonical" href="https://qrforgestudio.github.io/e.html">

<title>Free Background Remover - QR Forge Studio</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<nav class="nav">
<a href="index.html">🏠 Home</a>
<a href="resize.html">Resize</a>
<a href="d.html">Image Editor</a>
</nav>

<header>

<h1>Remove Background</h1>

<p class="muted">
Remove a simple background and create a transparent PNG.
</p>

</header>

<div class="grid">

<div class="card">

<h2>Background Remover</h2>

<label for="file">Choose Image</label>
<input id="file" type="file" accept="image/*">

<label for="background">Background Color</label>

<select id="background">

<option value="white">White</option>
<option value="black">Black</option>
<option value="custom">Custom</option>

</select>

<label for="customColor">Custom Color</label>

<input id="customColor" type="color" value="#ffffff">

<label for="tolerance">Tolerance</label>

<input
id="tolerance"
type="range"
min="1"
max="150"
value="45"
>

<p class="muted">
Increase tolerance to remove more similar colors.
</p>

<br>

<button class="btn primary" onclick="removeBackground()">
Remove Background
</button>

</div>

<div class="card preview">

<h2>Preview</h2>

<canvas id="canvas"></canvas>

<br>

<button class="btn primary" onclick="download()">
Download Transparent PNG
</button>

</div>

</div>

</div>

<script>

let image = new Image();

document.getElementById("file").addEventListener("change",function(){

const file = this.files[0];

if(!file) return;

const reader = new FileReader();

reader.onload = e => {

image.onload = drawOriginal;
image.src = e.target.result;

};

reader.readAsDataURL(file);

});

function drawOriginal(){

const canvas = document.getElementById("canvas");

canvas.width = image.naturalWidth;
canvas.height = image.naturalHeight;

canvas.getContext("2d").drawImage(
image,0,0
);

}

function hexToRGB(hex){

return {
r:parseInt(hex.substring(1,3),16),
g:parseInt(hex.substring(3,5),16),
b:parseInt(hex.substring(5,7),16)
};

}

function removeBackground(){

if(!image.src){

alert("Please choose an image first.");
return;

}

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

canvas.width = image.naturalWidth;
canvas.height = image.naturalHeight;

ctx.drawImage(image,0,0);

const pixels =
ctx.getImageData(
0,
0,
canvas.width,
canvas.height
);

const data = pixels.data;

const mode =
document.getElementById("background").value;

let bg;

if(mode === "white"){

bg = {r:255,g:255,b:255};

}
else if(mode === "black"){

bg = {r:0,g:0,b:0};

}
else{

bg = hexToRGB(
document.getElementById("customColor").value
);

}

const tolerance =
Number(document.getElementById("tolerance").value);

for(let i=0;i<data.length;i+=4){

const r = data[i];
const g = data[i+1];
const b = data[i+2];

const distance = Math.sqrt(
Math.pow(r-bg.r,2) +
Math.pow(g-bg.g,2) +
Math.pow(b-bg.b,2)
);

if(distance <= tolerance * 2){

data[i+3] = 0;

}

}

ctx.putImageData(pixels,0,0);

}

function download(){

const canvas = document.getElementById("canvas");

if(!canvas.width){

alert("Remove the background first.");
return;

}

const link = document.createElement("a");

link.download = "background-removed.png";
link.href = canvas.toDataURL("image/png");

link.click();

}

</script>

</body>
</html>

<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Remove Background — QR Forge Studio</title><link rel="stylesheet" href="style.css"></head><body><div class="container"><nav class="nav"><a href="index.html">🏠 Home</a><a href="resize.html">Resize</a></nav><div class="grid"><div class="card"><h2>Remove Background</h2><p class="hint">This local tool removes a connected background matching the selected color. It works best with clean, simple backgrounds.</p><input id="file" type="file" accept="image/*"><label>Background color</label><select id="mode"><option value="white">White</option><option value="black">Black</option><option value="color">Custom color</option></select><input id="color" type="color" value="#ffffff"><label>Tolerance</label><input id="tol" type="range" min="1" max="150" value="45"><br><br><button class="btn primary" onclick="removeNow()">Remove & Download PNG</button></div><div class="card preview" id="preview">Choose an image</div></div></div><script src="js/common.js"></script><script src="js/g.js"></script></body></html>

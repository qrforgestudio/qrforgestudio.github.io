<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Compress — QR Forge Studio</title><link rel="stylesheet" href="style.css"></head><body><div class="container"><nav class="nav"><a href="index.html">🏠 Home</a><a href="qr.generator.html">QR</a></nav><div class="grid"><div class="card"><h2>Compress Image</h2><input id="file" type="file" accept="image/*"><label>What will you use the image for?</label><select id="purpose" onchange="setCompressionPurpose()"><option value="custom">Custom target</option><option value="email">Email</option><option value="website">Website</option><option value="whatsapp">WhatsApp</option><option value="passport">Passport / ID upload</option><option value="form">Online Form</option><option value="under1mb">Under 1 MB</option><option value="under500kb">Under 500 KB</option><option value="under200kb">Under 200 KB</option></select><label>Maximum file size</label><div class="row"><input id="amount" type="number" value="1" min=".01" step=".01"><select id="unit"><option>MB</option><option>KB</option></select></div><label>Output</label><select id="format"><option value="image/jpeg">JPG</option><option value="image/webp">WebP</option><option value="image/png">PNG</option></select><div class="status" id="status">Choose a target and compress.</div><button class="btn primary" onclick="compressNow()">Compress & Download</button></div><div class="card preview" id="preview">Choose an image</div></div><div class="ad">ADVERTISEMENT SPACE</div></div><script src="js/common.js"></script><script src="js/e.js"></script></body></html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<meta name="google-adsense-account" content="ca-pub-2332110455488458">
<meta name="description" content="Free online image cropper. Crop images using exact X, Y, width and height values.">
<meta name="robots" content="index, follow">

<link rel="canonical" href="https://qrforgestudio.github.io/a.html">

<title>Free Image Cropper - QR Forge Studio</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<nav class="nav">
<a href="index.html">🏠 Home</a>
<a href="resize.html">Resize</a>
<a href="b.html">Convert</a>
</nav>

<header>
<h1>Image Cropper</h1>
<p class="muted">
Crop your images using exact dimensions.
</p>
</header>

<div class="grid">

<div class="card">

<h2>Crop Image</h2>

<label for="file">Choose Image</label>
<input id="file" type="file" accept="image/*">

<label for="x">X Position</label>
<input id="x" type="number" value="0">

<label for="y">Y Position</label>
<input id="y" type="number" value="0">

<label for="w">Crop Width</label>
<input id="w" type="number" value="500">

<label for="h">Crop Height</label>
<input id="h" type="number" value="500">

<br>

<button class="btn primary" onclick="cropImage()">
Crop Image
</button>

</div>

<div class="card preview">

<h2>Preview</h2>

<canvas id="canvas"></canvas>

<br>

<button class="btn primary" onclick="download()">
Download PNG
</button>

</div>

</div>

</div>

<script>

let image = new Image();

document.getElementById("file").addEventListener("change",function(){

const file = this.files[0];

if(!file) return;

const reader = new FileReader();

reader.onload = function(e){

image.onload = function(){

document.getElementById("w").value =
Math.min(500,image.naturalWidth);

document.getElementById("h").value =
Math.min(500,image.naturalHeight);

};

image.src = e.target.result;

};

reader.readAsDataURL(file);

});

function cropImage(){

if(!image.src){

alert("Please choose an image first.");
return;

}

const x = Number(document.getElementById("x").value);
const y = Number(document.getElementById("y").value);
const w = Number(document.getElementById("w").value);
const h = Number(document.getElementById("h").value);

if(
x < 0 ||
y < 0 ||
w <= 0 ||
h <= 0 ||
x + w > image.naturalWidth ||
y + h > image.naturalHeight
){

alert("The crop area is outside the image.");
return;

}

const canvas = document.getElementById("canvas");

canvas.width = w;
canvas.height = h;

canvas.getContext("2d").drawImage(
image,
x,y,w,h,
0,0,w,h
);

}

function download(){

const canvas = document.getElementById("canvas");

if(!canvas.width){

alert("Crop an image first.");
return;

}

const link = document.createElement("a");

link.download = "cropped-image.png";
link.href = canvas.toDataURL("image/png");

link.click();

}

</script>

</body>
</html>

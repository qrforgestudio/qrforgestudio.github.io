<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<meta name="google-adsense-account" content="ca-pub-2332110455488458">
<meta name="description" content="Free online image compressor. Reduce image file size for websites, email, WhatsApp and applications.">
<meta name="robots" content="index, follow">

<link rel="canonical" href="https://qrforgestudio.github.io/c.html">

<title>Free Image Compressor - QR Forge Studio</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<nav class="nav">
<a href="index.html">🏠 Home</a>
<a href="resize.html">Resize</a>
<a href="b.html">Convert</a>
</nav>

<header>
<h1>Image Compressor</h1>
<p class="muted">
Reduce image file size directly in your browser.
</p>
</header>

<div class="grid">

<div class="card">

<h2>Compress Image</h2>

<label for="file">Choose Image</label>
<input id="file" type="file" accept="image/*">

<label for="purpose">Purpose</label>

<select id="purpose">
<option>Custom</option>
<option>Passport / Application</option>
<option>Website</option>
<option>WhatsApp</option>
<option>Email</option>
</select>

<label for="quality">Quality</label>

<input id="quality" type="range" min="10" max="100" value="70">

<p id="qualityText" class="muted">70%</p>

<label for="maxSize">Target Size (KB)</label>

<input id="maxSize" type="number" value="500" min="10">

<br>

<button class="btn primary" onclick="compressImage()">
Compress Image
</button>

</div>

<div class="card preview">

<h2>Result</h2>

<canvas id="canvas"></canvas>

<p id="result" class="muted"></p>

<button class="btn primary" onclick="download()">
Download
</button>

</div>

</div>

</div>

<script>

let image = new Image();
let compressedBlob = null;

document.getElementById("file").addEventListener("change",function(){

const file = this.files[0];

if(!file) return;

const reader = new FileReader();

reader.onload = e => {

image.onload = function(){

document.getElementById("result").textContent =
"Original size: " +
Math.round(file.size / 1024) +
" KB";

};

image.src = e.target.result;

};

reader.readAsDataURL(file);

});

document.getElementById("quality").addEventListener("input",function(){

document.getElementById("qualityText").textContent =
this.value + "%";

});

function compressImage(){

if(!image.src){

alert("Please choose an image first.");
return;

}

const canvas = document.getElementById("canvas");

let scale = 1;

const maxDimension = 2000;

if(image.naturalWidth > maxDimension)
scale = maxDimension / image.naturalWidth;

if(image.naturalHeight * scale > maxDimension)
scale = maxDimension / image.naturalHeight;

canvas.width =
Math.round(image.naturalWidth * scale);

canvas.height =
Math.round(image.naturalHeight * scale);

canvas.getContext("2d").drawImage(
image,
0,
0,
canvas.width,
canvas.height
);

const quality =
Number(document.getElementById("quality").value) / 100;

canvas.toBlob(function(blob){

compressedBlob = blob;

document.getElementById("result").textContent =
"Compressed size: " +
Math.round(blob.size / 1024) +
" KB";

},"image/jpeg",quality);

}

function download(){

if(!compressedBlob){

alert("Compress an image first.");
return;

}

const url = URL.createObjectURL(compressedBlob);

const link = document.createElement("a");

link.href = url;
link.download = "compressed-image.jpg";

link.click();

setTimeout(() => URL.revokeObjectURL(url),1000);

}

</script>

</body>
</html>

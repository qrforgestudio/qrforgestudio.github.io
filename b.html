<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Free Image Converter - QR Forge Studio</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<nav class="nav">
<a href="index.html">🏠 Home</a>
<a href="qr.generator.html">QR Generator</a>
<a href="c.html">Compress</a>
</nav>

<header>
<h1>Image Converter</h1>
<p class="muted">
Convert images between PNG, JPG and WebP.
</p>
</header>

<div class="grid">

<div class="card">

<h2>Convert Image</h2>

<label for="file">Choose Image</label>
<input id="file" type="file" accept="image/*">

<label for="format">Output Format</label>

<select id="format">
<option value="image/png">PNG</option>
<option value="image/jpeg">JPG</option>
<option value="image/webp">WebP</option>
</select>

<label for="quality">Quality</label>

<input id="quality" type="range" min="10" max="100" value="90">

<p id="qualityText" class="muted">90%</p>

<button class="btn primary" onclick="convertImage()">
Convert Image
</button>

</div>

<div class="card preview">

<h2>Preview</h2>

<canvas id="canvas"></canvas>

<br>

<button class="btn primary" onclick="download()">
Download
</button>

</div>

</div>

</div>

<script>

let image = new Image();

document.getElementById("file").addEventListener("change",function(){

const file = this.files[0];

if(!file) return;

const reader = new FileReader();

reader.onload = e => {
image.src = e.target.result;
};

reader.readAsDataURL(file);

});

document.getElementById("quality").addEventListener("input",function(){

document.getElementById("qualityText").textContent =
this.value + "%";

});

function convertImage(){

if(!image.src){

alert("Please choose an image first.");
return;

}

image.onload = draw;

if(image.complete)
draw();

}

function draw(){

const canvas = document.getElementById("canvas");

canvas.width = image.naturalWidth;
canvas.height = image.naturalHeight;

canvas.getContext("2d").drawImage(
image,0,0
);

}

function download(){

const canvas = document.getElementById("canvas");

if(!canvas.width){

alert("Convert an image first.");
return;

}

const format =
document.getElementById("format").value;

const quality =
Number(document.getElementById("quality").value) / 100;

let extension = "png";

if(format === "image/jpeg")
extension = "jpg";

if(format === "image/webp")
extension = "webp";

const link = document.createElement("a");

link.download =
"converted-image." + extension;

link.href =
canvas.toDataURL(format,quality);

link.click();

}

</script>

</body>
</html>
